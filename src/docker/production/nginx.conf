# Caddy is the only external ingress and overwrites X-Real-IP.
# Its host-network connection is seen through the Docker bridge gateway.
map $uri $ecodata_log_uri {
    ~^/reset-password/ /reset-password/[redacted];
    ~^/verify-email/ /verify-email/[redacted];
    default $uri;
}
log_format ecodata '$remote_addr [$time_local] "$request_method $ecodata_log_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name ecodata.varcor.tech;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 40M;
    access_log /dev/stdout ecodata;

    set_real_ip_from 172.28.241.1;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only school branding is public. Legacy PDFs/evidence still require PHP authorization.
    location ^~ /storage/schools/shields/ {
        alias /var/www/public-storage/schools/shields/;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    location /storage/ { return 404; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 70s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { return 404; }
}
